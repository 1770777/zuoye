<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<meta name="description" content="粘贴排课清单，一键生成整月教案图片与文本">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23090b10'/><rect x='22' y='24' width='56' height='9' rx='4.5' fill='%235b8cff'/><rect x='22' y='44' width='56' height='7' rx='3.5' fill='%23e9edf5'/><rect x='22' y='61' width='40' height='7' rx='3.5' fill='%23e9edf5'/><rect x='22' y='78' width='48' height='7' rx='3.5' fill='%2343c59e'/></svg>">
<title>教案生成器</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<header class="top">
  <div class="wrap brand">
    <span class="logo">教</span>
    <div class="brand-text">
      <h1>教案生成器</h1>
      <p>粘贴排课清单，生成整月教案图片与文本</p>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <div class="panel-head">
      <label for="todo">排课清单</label>
      <div class="links">
        <button id="sample" class="link" type="button">示例</button>
        <button id="clear" class="link" type="button">清空</button>
      </div>
    </div>

    <textarea id="todo" spellcheck="false" autocomplete="off" placeholder="每行一节课，例如：&#10;11.1 张歆（腹）&#10;11.1 开肩美背🌟🌟&#10;11.4 星野 90min（腹+腿）"></textarea>

    <p class="format">
      <span><b>私教</b>：日期 + 姓名（部位）</span>
      <span><b>团课</b>：日期 + 课名，不用写人</span>
    </p>

    <div class="actions">
      <button id="run" class="btn primary" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M12 5l7 7-7 7" /></svg>
        生成
      </button>
      <button id="shareAll" class="btn share" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" /><circle cx="8.5" cy="10" r="1.6" /><path d="M4 17l5-4 4 3 3-2 4 3" /></svg>
        <span id="shareAllText">全部存到相册</span>
      </button>
      <button id="zip" class="btn" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l4-4m-4 4l-4-4M5 19h14" /></svg>
        下载图片包
      </button>
      <button id="txt" class="btn" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" /><path d="M9 12h6M9 16h6" /></svg>
        下载文本
      </button>
    </div>

    <div class="history">
      <span id="histInfo" class="muted">历史档案加载中…</span>
      <span class="links">
        <label class="link" for="histFile" role="button">导入我的历史</label>
        <input id="histFile" type="file" accept=".txt,text/plain" multiple hidden>
        <button id="histClear" class="link" type="button">清除导入</button>
      </span>
    </div>

    <p id="status" class="status" aria-live="polite"></p>
    <p id="progress" class="progress" hidden></p>
  </section>

  <section id="result" class="result" hidden>
    <div id="summary" class="summary"></div>
    <div id="cards" class="cards"></div>
  </section>

  <footer class="foot">
    <p>所有内容只在你的浏览器里处理，不会上传到任何服务器。</p>
    <p>图片包内含每节课的 PNG 与整月 .txt。</p>
  </footer>
</main>

<script src="assets/library.js"></script>
<script src="assets/history.js"></script>
<script src="assets/engine.js"></script>
<script src="assets/render.js"></script>
<script src="assets/zip.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
